<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drop achievement</title>
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #fafafa;
      font: 14px system-ui;
      overflow: hidden;
      pointer-events: none;
    }
    article {
      box-sizing: border-box;
      margin: 8px;
      padding: 18px;
      border: 1px solid #a855f7;
      border-radius: 14px;
      background: #18181bf5;
      height: 116px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .badge {
      color: #c084fc;
      font-size: 32px;
    }
    small {
      color: #d8b4fe;
    }
    h1 {
      font-size: 16px;
      margin: 4px 0;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    p {
      font-size: 12px;
      margin: 0;
      color: #d4d4d8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .copy {
      min-width: 0;
    }
  </style>
  <article role="status">
    <span class="badge" aria-hidden="true">★</span>
    <div class="copy">
      <small>Achievement unlocked</small>
      <h1 id="title"></h1>
      <p id="description"></p>
    </div>
  </article>
  <script>
    window.showAchievement = (data) => {
      document.getElementById("title").textContent = data.title;
      document.getElementById("description").textContent = data.description;
    };
  </script>
</html>
