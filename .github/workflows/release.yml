name: "publish"

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # Pinned to match src-tauri/rust-toolchain.toml — see the comment
      # in that file for why nightly is dated rather than tracking latest.
      - name: install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-20

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev libssl-dev libgtk-3-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libfuse2 libarchive-dev

      - name: install frontend dependencies
        run: pnpm install

      # Pre-seed Tauri's NSIS toolchain cache (Windows only).
      #
      # WHY: tauri-bundler fetches its own NSIS toolchain from GitHub at bundle
      # time, and that fetch is a SINGLE ureq GET with no retry — one dropped
      # connection kills the whole build. That is exactly what happened to the
      # v5.7.0 Windows leg: it died twice, ~25 minutes apart, 0.2s after
      # "Downloading .../nsis-3.11.zip" with `failed to bundle project
      # `io: Peer disconnected``, while the ubuntu leg of the same run published
      # fine. The asset was never missing — the connection was just refused.
      # Doing the download here, with retries, means the bundler finds the cache
      # already populated and makes zero network calls for its toolchain.
      #
      # The bundler skips its download only if <cache>\NSIS exists AND every
      # required file is present AND nsis_tauri_utils.dll hashes correctly;
      # if ANY of those is false it deletes the directory and does the full cold
      # download again. So a half-seeded cache is worse than none — hence this
      # step verifies everything and fails loudly rather than limping on. This is
      # the opposite of the umu-launcher / zerotier blocks further down, which
      # are deliberately tolerant because they bundle optional extras; the NSIS
      # toolchain is not optional, no NSIS means no installer.
      #
      # Cache location is dirs::cache_dir() (SHGetKnownFolderPath FOLDERID_
      # LocalAppData), i.e. C:\Users\runneradmin\AppData\Local\tauri. It cannot
      # be redirected by setting %LOCALAPPDATA%, and NSIS_PATH is a no-op on
      # Windows, so seeding the real path is the only lever.
      #
      # No GITHUB_TOKEN on these downloads, on purpose. The 403 that bit the umu
      # block was api.github.com's 60-req/hr anonymous limit; these are release
      # ASSET downloads (github.com -> release-assets.githubusercontent.com),
      # which are served from the CDN and aren't subject to that limit. Sending
      # an Authorization header would either be dropped by curl on the cross-host
      # redirect or rejected by the signed asset URL as a double auth mechanism,
      # so it can only hurt.
      - name: Pre-seed Tauri NSIS toolchain (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $toolsDir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'tauri'
          $nsisDir  = Join-Path $toolsDir 'NSIS'
          $staging  = Join-Path $env:RUNNER_TEMP 'nsis-seed'

          # Versions/hashes are the constants baked into tauri-bundler 2.9.1
          # (@tauri-apps/cli 2.11.1). Bump these together with the CLI.
          $nsisUrl     = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
          $nsisSha1    = 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'
          $utilsUrl    = 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll'
          $utilsSha1   = '75197FEE3C6A814FE035788D1C34EAD39349B860'
          # Third fetch of the same bundling step: tauri.conf.json uses
          # webviewInstallMode.embedBootstrapper, which downloads this from
          # go.microsoft.com (existence check only, no hash).
          $webview2Url = 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'

          function Fetch($url, $dest) {
            Write-Host "Downloading $url"
            curl.exe --fail --location --silent --show-error `
              --retry 6 --retry-delay 5 --retry-all-errors `
              --connect-timeout 30 --max-time 600 `
              --output $dest -- $url
            if ($LASTEXITCODE -ne 0) {
              throw "Download FAILED after retries (curl exit $LASTEXITCODE): $url"
            }
            if (-not (Test-Path -LiteralPath $dest)) {
              throw "Download reported success but produced no file: $dest"
            }
          }

          function Assert-Sha1($path, $expected, $label) {
            $actual = (Get-FileHash -Algorithm SHA1 -LiteralPath $path).Hash
            if ($actual -ne $expected.ToUpper()) {
              throw "$label SHA1 MISMATCH: got $actual, expected $expected"
            }
            Write-Host "$label SHA1 ok ($actual)"
          }

          # Start from a clean slate: a leftover NSIS\ or an intermediate
          # nsis-3.11\ next to it makes the bundler's own rename() blow up.
          foreach ($stale in @($nsisDir, (Join-Path $toolsDir 'nsis-3.11'), $staging)) {
            if (Test-Path -LiteralPath $stale) { Remove-Item -Recurse -Force -LiteralPath $stale }
          }
          New-Item -ItemType Directory -Force -Path $toolsDir, $staging | Out-Null

          $zip = Join-Path $staging 'nsis-3.11.zip'
          Fetch $nsisUrl $zip
          Assert-Sha1 $zip $nsisSha1 'nsis-3.11.zip'

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $staging)
          $extracted = Join-Path $staging 'nsis-3.11'
          if (-not (Test-Path -LiteralPath $extracted)) {
            throw "Extraction produced no nsis-3.11 folder under $staging"
          }
          Move-Item -LiteralPath $extracted -Destination $nsisDir

          # nsis_tauri_utils.dll is a SECOND, separate download the bundler does
          # right after the zip - seed it too or the build just dies one line later.
          $additional = Join-Path $nsisDir 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force -Path $additional | Out-Null
          $dll = Join-Path $additional 'nsis_tauri_utils.dll'
          Fetch $utilsUrl $dll
          # The bundler re-verifies this hash on every warm run; a mismatch here
          # means it would re-download the dll at bundle time.
          Assert-Sha1 $dll $utilsSha1 'nsis_tauri_utils.dll'

          # Every path tauri-bundler checks. Miss one and it wipes the whole
          # directory and cold-downloads again - the failure we are fixing.
          $required = @(
            'makensis.exe',
            'Bin/makensis.exe',
            'Stubs/lzma-x86-unicode',
            'Stubs/lzma_solid-x86-unicode',
            'Plugins/x86-unicode/additional/nsis_tauri_utils.dll',
            'Include/MUI2.nsh',
            'Include/FileFunc.nsh',
            'Include/x64.nsh',
            'Include/nsDialogs.nsh',
            'Include/WinMessages.nsh',
            'Include/Win/COM.nsh',
            'Include/Win/Propkey.nsh',
            'Include/Win/RestartManager.nsh'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $nsisDir $_)) }
          if ($missing) {
            throw "NSIS seed INCOMPLETE, tauri would wipe it and re-download. Missing: $($missing -join ', ')"
          }
          Write-Host "All $($required.Count) required NSIS files present"

          # WebView2 bootstrapper: embedBootstrapper mode fetches this during the
          # same bundling step, also unretried. Not a github.com URL so the mirror
          # env vars would not cover it either.
          $webview2 = Join-Path $toolsDir 'MicrosoftEdgeWebview2Setup.exe'
          Fetch $webview2Url $webview2
          $wvSize = (Get-Item -LiteralPath $webview2).Length
          if ($wvSize -lt 500KB) {
            throw "MicrosoftEdgeWebview2Setup.exe looks bogus ($wvSize bytes) - probably an error page, not the bootstrapper"
          }
          $head = [System.IO.File]::ReadAllBytes($webview2)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "MicrosoftEdgeWebview2Setup.exe is not a PE binary (no MZ header)"
          }
          Write-Host "WebView2 bootstrapper ok ($wvSize bytes)"

          Remove-Item -Recurse -Force -LiteralPath $staging

          # Leave a listing in the log so a future bundling failure is diagnosable.
          $all = Get-ChildItem -Recurse -File -LiteralPath $nsisDir
          Write-Host "--- seeded $nsisDir : $($all.Count) files, $([math]::Round(($all | Measure-Object Length -Sum).Sum / 1MB, 2)) MB ---"
          Get-ChildItem -LiteralPath $toolsDir | Format-Table Mode, Length, Name | Out-String | Write-Host
          Get-ChildItem -LiteralPath $nsisDir | Format-Table Mode, Length, Name | Out-String | Write-Host
          foreach ($p in $required) {
            $f = Get-Item -LiteralPath (Join-Path $nsisDir $p)
            Write-Host ("  {0,10}  {1}" -f $f.Length, $p)
          }

      - uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
          # Updater code-signing. Generate locally with
          # `pnpm tauri signer generate -w ~/.tauri/drop.key`, then add both as
          # repo Actions secrets. When present, tauri-action signs each artifact
          # and emits `latest.json` (the in-app updater endpoint).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Use the tag from the release event so we don't create a second release.
          # Falls back to v__VERSION__ for manual workflow_dispatch triggers.
          tagName: ${{ github.event.release.tag_name || 'v__VERSION__' }}
          releaseName: ${{ github.event.release.tag_name || 'v__VERSION__' }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Repack the AppImage: keep WebKitGTK and its dependencies (needed on
      # SteamOS which doesn't ship webkit2gtk-4.1), but remove libs that clash
      # with the host (glib, EGL/mesa — cause crashes due to symbol mismatches
      # between Ubuntu 22.04 build env and SteamOS runtime).
      # Also bundles umu-launcher so Windows game compatibility works out of the box.
      - name: Fix AppImage for SteamOS compatibility
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping"
            exit 0
          fi
          echo "Fixing AppImage: $APPIMAGE"

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          # Remove libs that conflict with SteamOS host, but KEEP WebKitGTK
          # and its dependencies so the app works without system webkit installed.
          if [ -d squashfs-root/usr/lib ]; then
            cd squashfs-root/usr/lib
            # Remove problematic glib/gio/mesa/EGL libs that cause symbol clashes
            rm -f libglib-2.0.so* libgio-2.0.so* libgobject-2.0.so* libgmodule-2.0.so*
            rm -f libEGL*.so* libGL*.so* libGLX*.so* libGLdispatch*.so*
            rm -f libdrm*.so* libgbm*.so* libwayland*.so*
            rm -f libffi*.so* libpcre2*.so* libmount*.so* libblkid*.so*
            # Keep: libwebkit2gtk-4.1, libjavascriptcoregtk-4.1, libsoup-3.0,
            #        and any other non-conflicting deps Tauri bundled
            echo "Kept bundled libs:"
            ls -la *.so* 2>/dev/null || echo "(none remaining)"
            cd ../../..
          fi

          # Bundle umu-launcher (zipapp) so Windows-game compat works out of
          # the box. Same approach as the Flatpak build script — downloads the
          # standalone zipapp release which is a single self-contained
          # executable.
          #
          # The GitHub API call is authenticated against the workflow's
          # GITHUB_TOKEN so we don't hit the 60-req/hr anonymous rate limit —
          # that's what 403'd the publish run and then crashed the downstream
          # python `json.load` with an empty stdin. Whole umu-bundle block is
          # also tolerant of any failure: if curl/json-parse/download/extract
          # goes sideways we log a WARNING and ship the AppImage without umu
          # pre-bundled rather than failing the whole release build — users
          # can install umu-launcher separately, Windows-game compat still
          # works on their machine, just not out of the box.
          echo "Downloading umu-launcher..."
          UMU_API_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Open-Wine-Components/umu-launcher/releases/latest" || true)
          if [ -z "$UMU_API_JSON" ]; then
            echo "WARNING: GitHub API request for umu-launcher failed (rate-limit, network, or auth) — skipping bundle"
          else
            UMU_URL=$(echo "$UMU_API_JSON" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(next((a['browser_download_url'] for a in d['assets'] if 'zipapp.tar' in a['name']), ''))
          except Exception:
              pass
          " || true)
            if [ -z "$UMU_URL" ]; then
              echo "WARNING: Could not find umu-launcher zipapp asset URL, skipping bundle"
            elif curl -fsSL -o /tmp/umu.tar "$UMU_URL"; then
              tar -xf /tmp/umu.tar -C /tmp/
              UMU_BIN=$(find /tmp -maxdepth 4 -name "umu-run" -type f | head -1)
              if [ -n "$UMU_BIN" ]; then
                mkdir -p squashfs-root/usr/bin
                cp "$UMU_BIN" squashfs-root/usr/bin/umu-run
                chmod +x squashfs-root/usr/bin/umu-run
                echo "Bundled umu-run: $(squashfs-root/usr/bin/umu-run --version 2>&1 || echo 'ok')"
              else
                echo "WARNING: umu-run not found in archive, skipping bundle"
              fi
              rm -f /tmp/umu.tar
            else
              echo "WARNING: umu-launcher download failed, skipping bundle"
            fi
          fi

          # Bundle zerotier-one (full client) for co-op virtual-LAN rooms.
          # Mirrors the proven Steam Deck recipe: stage the Arch package plus the
          # two libs SteamOS lacks (libminiupnpc, libnatpmp) into usr/bin + usr/lib
          # so the app can run + setcap a private copy at runtime. Tolerant of any
          # failure — co-op rooms are optional, so a mirror hiccup ships the
          # AppImage without them rather than failing the whole release.
          echo "Bundling zerotier-one..."
          zt_fetch() {
            local fn repo
            for repo in extra core; do
              fn=$(curl -fsSL "https://archlinux.org/packages/$repo/x86_64/$1/json/" | python3 -c "import sys,json; print(json.load(sys.stdin)['filename'])" 2>/dev/null || true)
              if [ -n "$fn" ] && curl -fsSL -o "/tmp/$1.pkg.tar.zst" "https://geo.mirror.pkgbuild.com/$repo/os/x86_64/$fn"; then
                tar -I zstd -xf "/tmp/$1.pkg.tar.zst" -C /tmp usr 2>/dev/null && return 0
              fi
            done
            return 1
          }
          if zt_fetch zerotier-one && zt_fetch miniupnpc && zt_fetch libnatpmp \
             && [ -f /tmp/usr/bin/zerotier-one ]; then
            mkdir -p squashfs-root/usr/bin squashfs-root/usr/lib
            cp /tmp/usr/bin/zerotier-one squashfs-root/usr/bin/zerotier-one
            chmod +x squashfs-root/usr/bin/zerotier-one
            cp -a /tmp/usr/lib/libminiupnpc.so* squashfs-root/usr/lib/ 2>/dev/null || true
            cp -a /tmp/usr/lib/libnatpmp.so* squashfs-root/usr/lib/ 2>/dev/null || true
            # zerotier-one needs CAP_NET_ADMIN at runtime, which makes the dynamic
            # loader run in secure-execution mode and IGNORE LD_LIBRARY_PATH. Bake
            # an absolute RPATH to the client's staged libs dir (honored even for a
            # capability binary) so it still finds libminiupnpc/libnatpmp. SteamOS
            # always runs as user 'deck', so this runtime path is fixed.
            sudo apt-get install -y patchelf >/dev/null 2>&1 || true
            patchelf --set-rpath "/home/deck/.local/share/drop/tools/zerotier/libs" squashfs-root/usr/bin/zerotier-one \
              && echo "Set zerotier-one RPATH" || echo "WARNING: patchelf rpath failed"
            echo "Bundled zerotier-one: $(LD_LIBRARY_PATH=squashfs-root/usr/lib squashfs-root/usr/bin/zerotier-one -v 2>&1 || echo ok)"
          else
            echo "WARNING: zerotier-one bundle failed (package fetch/extract) — shipping without co-op rooms"
          fi

          # Download appimagetool to repack
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Repack the AppImage
          ARCH=x86_64 ./appimagetool squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      # Re-upload the fixed AppImage to the release
      - name: Upload fixed AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then exit 0; fi
          FILENAME=$(basename "$APPIMAGE")
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi

          # Delete the old AppImage asset and upload the fixed one
          RELEASE_ID=$(gh release view "$TAG_NAME" --json id -q .id 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh release delete-asset "$TAG_NAME" "$FILENAME" --yes 2>/dev/null || true
            gh release upload "$TAG_NAME" "$APPIMAGE" --clobber
          fi
