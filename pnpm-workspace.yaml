packages:
  - "main"
  - "libs/drop-base"

# Native deps whose install/build scripts pnpm is allowed to run.
# pnpm 10+ blocks postinstall build scripts by default; these four
# genuinely need to compile or fetch a platform binary:
#   - sharp           image processing native bindings
#   - @parcel/watcher native file-watcher (HMR)
#   - esbuild         downloads/links its platform binary
#   - unrs-resolver   native module resolver
# (Replaces an earlier broken `allowBuilds:` placeholder block whose
#  values were literally "set this to true or false" — not a real pnpm
#  key, so those three were silently treated as ignored builds and made
#  `pnpm install` exit non-zero on pnpm 11.)
onlyBuiltDependencies:
  - sharp
  - "@parcel/watcher"
  - esbuild
  - unrs-resolver

overrides:
  cross-spawn@<6.0.6: ">=6.0.6 <7"
  cross-spawn@>=7.0.0 <7.0.5: ">=7.0.5 <8"
  form-data@<2.5.4: ">=2.5.4 <3"
  got@<11.8.5: ">=11.8.5 <12"
  http-cache-semantics@<4.1.1: ">=4.1.1 <5"
  lodash@<4.17.21: ">=4.17.21 <5"
  lodash@>=4.0.0 <4.17.21: ">=4.17.21 <5"
  minimist@>=1.0.0 <1.2.6: ">=1.2.6 <2"
  nth-check@<2.0.1: ">=2.0.1 <3"
  semver-regex@<3.1.3: ">=3.1.3 <4"
  semver-regex@<3.1.4: ">=3.1.4 <4"
  semver@>=7.0.0 <7.5.2: ">=7.5.2 <8"
  sharp@<0.30.5: ">=0.30.5"
  sharp@<0.32.6: ">=0.32.6"
  tmp@<=0.2.3: ">=0.2.4 <0.3"
  tough-cookie@<4.1.3: ">=4.1.3 <5"
  trim-newlines@<3.0.1: ">=3.0.1 <4"
  # Dependabot 2026-06 security bumps — scoped to the vulnerable major
  # ranges so unrelated 1.x/2.x transitive copies are left untouched.
  # 2026-07: the 1.x and 2.x lines are now flagged too, and 5.0.6 itself is
  # vulnerable, so all three majors are pinned to their first-patched version.
  brace-expansion@>=1.0.0 <1.1.21: ">=1.1.21 <2" # 2026-10-30 audit (was <1.1.16)
  brace-expansion@>=2.0.0 <2.1.7: ">=2.1.7 <3" # 2026-10-30 audit (was <2.1.2)
  brace-expansion@>=5.0.0 <5.0.12: ">=5.0.12 <6" # 2026-10-30 audit (was <5.0.8)
  devalue@>=5.6.3 <5.9.3: ">=5.9.3 <6" # 2026-10-30 audit (was <5.8.1)
  nitropack@<2.13.4: ">=2.13.4 <3"
  postcss@<8.5.18: ">=8.5.18 <9" # 2026-07: high (was <8.5.10)
  simple-git@<3.36.0: ">=3.36.0 <4"
  ws@>=8.0.0 <8.20.1: ">=8.20.1 <9"
  # Dependabot 2026-06-16 security bumps — all transitive (Nuxt/Vite build
  # toolchain). Scoped to the vulnerable range so unrelated copies stay put.
  # Keep in sync with main/pnpm-workspace.yaml (the standalone frontend build).
  shell-quote@<1.11.0: ">=1.11.0 <2" # 2026-10-30 audit: critical (was <1.9.0)
  esbuild@<0.28.1: ">=0.28.1 <0.29" # alerts #134 high, #133 low
  vite@>=7.0.0 <7.3.7: ">=7.3.7 <8" # 2026-10-30 audit (was <7.3.5)
  tar@>=7.0.0 <7.5.21: ">=7.5.21 <8" # 2026-07: critical/high/medium (was #140 <7.5.16)
  launch-editor@<2.14.2: ">=2.14.2 <3" # 2026-10-30 audit (was <2.14.1)
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5" # 2026-10-30 audit (was <4.3.0)
  "@babel/core@<7.29.6": ">=7.29.6 <8" # alert #135 low
  # Dependabot 2026-07 security bumps — net-new transitive advisories.
  # Keep in sync with main/pnpm-workspace.yaml.
  immutable@>=5.0.0 <5.1.8: ">=5.1.8 <6" # 2026-07: high
  svgo@>=4.0.0 <4.1.0: ">=4.1.0 <5" # 2026-10-30 audit (was <4.0.2)
  dompurify@>=3.0.0 <3.4.17: ">=3.4.17 <4" # 2026-10-30 audit (was <3.4.12)
  # 2026-10-30 audit: same-major fixes, mostly the Nuxt toolchain that
  # libs/drop-base pulls in. Left out on purpose (fix needs a new major):
  # nuxt 4 and its vite-builder / nitro-server, minimatch 11, glob 14,
  # deepmerge (no fix). Keep in sync with main/pnpm-workspace.yaml.
  # No vue / @vue/server-renderer override: drop-base's `vue: latest` copy
  # can't be reached by one, so it only mixed versions.
  # drop-base pins an older nuxt 3; lift every copy to the patched 3.21 line.
  nuxt: ">=3.21.11 <4"
  node-forge@<1.4.1: ">=1.4.1 <2"
  seroval@<1.6.11: ">=1.6.11 <2"
  "@nuxt/devtools@<3.3.1": ">=3.3.1 <4"
  baseline-browser-mapping@<2.11.0: ">=2.11.0 <3"
  browserslist@<4.28.7: ">=4.28.7 <5"
  fast-copy@>=4.0.0 <4.1.0: ">=4.1.0 <5"
  nanoid@>=3.0.0 <3.3.18: ">=3.3.18 <4"
  postcss-selector-parser@>=6.0.0 <6.1.5: ">=6.1.5 <7"
  postcss-selector-parser@>=7.0.0 <7.1.6: ">=7.1.6 <8"
  serialize-javascript@>=7.0.0 <7.1.3: ">=7.1.3 <8"
  source-map-js@<1.2.2: ">=1.2.2 <2"
