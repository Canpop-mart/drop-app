packages:
  - "main"
  - "libs/drop-base"

# Native deps whose install/build scripts pnpm is allowed to run.
# pnpm 10+ blocks postinstall build scripts by default; these four
# genuinely need to compile or fetch a platform binary:
#   - sharp           image processing native bindings
#   - @parcel/watcher native file-watcher (HMR)
#   - esbuild         downloads/links its platform binary
#   - unrs-resolver   native module resolver
# (Replaces an earlier broken `allowBuilds:` placeholder block whose
#  values were literally "set this to true or false" — not a real pnpm
#  key, so those three were silently treated as ignored builds and made
#  `pnpm install` exit non-zero on pnpm 11.)
onlyBuiltDependencies:
  - sharp
  - "@parcel/watcher"
  - esbuild
  - unrs-resolver

overrides:
  cross-spawn@<6.0.6: ">=6.0.6"
  cross-spawn@>=7.0.0 <7.0.5: ">=7.0.5"
  form-data@<2.5.4: ">=2.5.4"
  got@<11.8.5: ">=11.8.5"
  http-cache-semantics@<4.1.1: ">=4.1.1"
  lodash@<4.17.21: ">=4.17.21"
  lodash@>=4.0.0 <4.17.21: ">=4.17.21"
  minimist@>=1.0.0 <1.2.6: ">=1.2.6"
  nth-check@<2.0.1: ">=2.0.1"
  semver-regex@<3.1.3: ">=3.1.3"
  semver-regex@<3.1.4: ">=3.1.4"
  semver@>=7.0.0 <7.5.2: ">=7.5.2"
  sharp@<0.30.5: ">=0.30.5"
  sharp@<0.32.6: ">=0.32.6"
  tmp@<=0.2.3: ">=0.2.4"
  tough-cookie@<4.1.3: ">=4.1.3"
  trim-newlines@<3.0.1: ">=3.0.1"
  # Dependabot 2026-06 security bumps — scoped to the vulnerable major
  # ranges so unrelated 1.x/2.x transitive copies are left untouched.
  # 2026-07: the 1.x and 2.x lines are now flagged too, and 5.0.6 itself is
  # vulnerable, so all three majors are pinned to their first-patched version.
  brace-expansion@>=1.0.0 <1.1.16: ">=1.1.16 <2" # 2026-07: high
  brace-expansion@>=2.0.0 <2.1.2: ">=2.1.2 <3" # 2026-07: high
  brace-expansion@>=5.0.0 <5.0.8: ">=5.0.8 <6" # 2026-07: high (supersedes <5.0.6)
  devalue@>=5.6.3 <5.8.1: ">=5.8.1"
  nitropack@<2.13.4: ">=2.13.4"
  postcss@<8.5.18: ">=8.5.18 <9" # 2026-07: high (was <8.5.10)
  simple-git@<3.36.0: ">=3.36.0"
  ws@>=8.0.0 <8.20.1: ">=8.20.1"
  # Dependabot 2026-06-16 security bumps — all transitive (Nuxt/Vite build
  # toolchain). Scoped to the vulnerable range so unrelated copies stay put.
  # Keep in sync with main/pnpm-workspace.yaml (the standalone frontend build).
  shell-quote@<1.9.0: ">=1.9.0 <2" # 2026-07: high (was #130 <1.8.4)
  esbuild@<0.28.1: ">=0.28.1" # alerts #134 high, #133 low
  vite@>=7.0.0 <7.3.5: ">=7.3.5 <8" # alerts #137 high, #139 medium
  tar@>=7.0.0 <7.5.21: ">=7.5.21 <8" # 2026-07: critical/high/medium (was #140 <7.5.16)
  launch-editor@<2.14.1: ">=2.14.1" # alert #138 medium
  js-yaml@>=4.0.0 <4.3.0: ">=4.3.0 <5" # 2026-07: high (was #136 <4.2.0)
  "@babel/core@<7.29.6": ">=7.29.6 <8" # alert #135 low
  # Dependabot 2026-07 security bumps — net-new transitive advisories.
  # Keep in sync with main/pnpm-workspace.yaml.
  immutable@>=5.0.0 <5.1.8: ">=5.1.8 <6" # 2026-07: high
  svgo@>=4.0.0 <4.0.2: ">=4.0.2 <5" # 2026-07: high (patch within v4)
  dompurify@>=3.0.0 <3.4.12: ">=3.4.12 <4" # 2026-07: low
